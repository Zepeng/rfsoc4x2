# Real-Conifer-BDT HLS build for Vitis 2025.2.
#
# Invoke v++ from the repository root with
# --work_dir build/vitis_dummy_kernel_2025_2/hls_bdt. The generated Conifer
# firmware must be present in csi_bdt_prj_kv260/firmware. Keep this output
# separate from dummy_kernel.xo so a fallback build cannot be deployed by
# mistake.

[hls]
flow_target=vitis
syn.file=../../src/vitis_adc_platform/dummy_kernel.cpp
syn.cflags=-DUSE_CONIFER_BDT=1 -I../../src/vitis_adc_platform -I../../csi_bdt_prj_kv260/firmware
syn.top=dummy_kernel
package.output.format=xo
package.output.file=../../build/vitis_dummy_kernel_2025_2/dummy_kernel_bdt.xo
package.output.syn=true
