# Invoke v++ from the repository root with
# --work_dir build/vitis_dummy_kernel_2025_2/hls_word2. Vitis resolves syn.file from
# the parent of work_dir, but package.output.file from this config file's
# directory. The platform and 307.2 MHz clock are supplied on the command line
# because the exported XPFM path is host-specific. This evaluation build uses
# two 16-bit ADC samples in each RFDC AXI word.

[hls]
flow_target=vitis
syn.file=../../src/vitis_adc_platform/dummy_kernel.cpp
syn.top=dummy_kernel
package.output.format=xo
package.output.file=../../build/vitis_dummy_kernel_2025_2/dummy_kernel_word2.xo
package.output.syn=true
